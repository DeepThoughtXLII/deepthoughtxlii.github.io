<body>

    <div class="filters">

        <div class="dropdown year">
            <label>Year: </label>
            <select>
                <option value="any">any</option>
                <option value="2019">2019</option>
                <option value="2020">2020</option>
                <option value="2021">2021</option>
                <option value="2022">2022</option>
                <option value="2023">2023</option>
                <option value="2024">2024</option>
                <option value="2025">2025</option>
                <option value="2026">2026</option>
            </select>
        </div>

        <div class="dropdown team-size">
            <label>Team Size: </label>
            <select>
                <option value="any">any</option>
                <option value="Solo">Solo</option>
                <option value="2-5 people">2-5 people</option>
                <option value="6-10 people">6-10 people</option>
            </select>
        </div>

        <div class="dropdown framework">
            <label>Project Framework: </label>
            <select>
                <option value="any">any</option>
                <option value="Unity C#">Unity C#</option>
                <option value="SFML C++">SFML C++</option>
            </select>
        </div>

        <div class="dropdown duration">
            <label>Project Duration: </label>
            <select>
                <option value="any">any</option>
                <option value="Game Jam (2-3 days)">Game Jam (2-3 days)</option>
                <option value="1-2 weeks">1-2 weeks</option>
                <option value="1-3 months">1-3 months</option>
                <option value="6 months+">6 months+</option>
                <option value="1 year+">1 year+</option>
            </select>
        </div>

        <div class="dropdown platform">
            <label>Project Platform: </label>
            <select>
                <option value="any">any</option>
                <option value="mobile">mobile</option>
                <option value="PC">PC</option>
                <option value="other">other</option>
            </select>
        </div>

    </div>


    <hr>

    <div id="project-container" class="all-projects-container">

        <template id="template-project">
            <div class="single-project-container">

                <div class="project-header">
                    <div class="project-tags">
                        <span class="template">
                            2 years
                        </span>
                    </div>
                </div>

                <div class="project-body">
                    <div class="project-LeftSide">
                        <div class="project-videos">
                        </div>
                        <div class="project-images">
                        </div>     
                    </div>

                    <div class="project-RightSide">
                        <h2 class="project-name">The TransitieGame</h2>
                        <p class="project-text"></p>
                    </div>
                </div>
            </div>

        </template>

    </div>
